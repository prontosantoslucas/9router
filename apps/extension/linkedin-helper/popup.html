<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 340px; padding: 12px; margin: 0; background: #0f172a; color: #e2e8f0; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #93c5fd; }
    .status { padding: 8px; background: #1e293b; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
    .status .row { display: flex; justify-content: space-between; margin: 2px 0; }
    .status .label { color: #94a3b8; }
    .status .value { color: #e2e8f0; font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
    .dot.ok { background: #22c55e; }
    .dot.warn { background: #eab308; }
    .dot.err { background: #ef4444; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-top: 8px; margin-bottom: 2px; }
    input[type=text], input[type=password] { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 12px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 10px; border-radius: 4px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; font-size: 12px; }
    button:hover { background: #2563eb; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .footer { margin-top: 12px; font-size: 10px; color: #64748b; text-align: center; }
    a { color: #93c5fd; text-decoration: none; }
  </style>
</head>
<body>
  <h1>9router LinkedIn Helper</h1>

  <div class="status">
    <div class="row"><span class="label">Status</span><span class="value" id="s-state">—</span></div>
    <div class="row"><span class="label">LinkedIn</span><span class="value" id="s-linkedin">—</span></div>
    <div class="row"><span class="label">Ultimo job</span><span class="value" id="s-job">—</span></div>
    <div class="row"><span class="label">Ultimo erro</span><span class="value" id="s-err">—</span></div>
  </div>

  <label>URL do agent</label>
  <input type="text" id="agentUrl" placeholder="https://maxrouter-prod.up.railway.app">

  <label>Token de acesso (EXTENSION_TOKEN)</label>
  <input type="password" id="token" placeholder="cola aqui o token que o agent te deu">

  <button id="save">Salvar config</button>

  <div class="grid">
    <button class="secondary" id="poll-now">Poll agora</button>
    <button class="secondary" id="toggle-enabled">Pausar</button>
  </div>

  <div class="footer">
    v0.1.0 · <a href="https://github.com/prontosantoslucas/9router" target="_blank">docs</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
