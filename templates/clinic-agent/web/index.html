<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atendimento — Clínica</title>
<style>
  :root { --brand: #10a37f; --bg: #f7f8fa; --bubble-me: #dcf8c6; --bubble-bot: #ffffff; --text: #1a1a1a; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #ece5dd; }
  .header { background: #075E54; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .name { font-weight: 600; }
  .status { font-size: 12px; opacity: 0.8; }
  .messages { flex: 1; padding: 16px 12px; overflow-y: auto; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; box-shadow: 0 1px 1px rgba(0,0,0,0.05); line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { background: var(--bubble-me); margin-left: auto; border-top-right-radius: 4px; }
  .msg.bot { background: var(--bubble-bot); margin-right: auto; border-top-left-radius: 4px; }
  .time { display: block; font-size: 10px; color: var(--muted); text-align: right; margin-top: 2px; }
  .typing { color: var(--muted); font-style: italic; margin: 4px 8px; }
  form { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; border-top: 1px solid #ddd; }
  input[type=text] { flex: 1; padding: 10px 14px; border: 0; border-radius: 24px; background: #fff; font-size: 14px; outline: none; }
  button { padding: 10px 16px; border: 0; border-radius: 24px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">C</div>
    <div>
      <div class="name" id="clinic-name">Clínica</div>
      <div class="status" id="status">online agora</div>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Digite sua mensagem…" autocomplete="off" required />
    <button id="send">Enviar</button>
  </form>
</div>

<script>
(async () => {
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const status = document.getElementById("status");

  // Nome da clínica via health
  try {
    const h = await fetch("/health").then((r) => r.json());
    if (h.clinic) document.getElementById("clinic-name").textContent = h.clinic;
  } catch {}

  let chatId = localStorage.getItem("clinicChatId") || null;

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "me" : "bot");
    const now = new Date();
    div.innerHTML = text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + `<span class="time">${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setTyping(on) {
    let el = document.getElementById("typing");
    if (on) {
      if (!el) {
        el = document.createElement("div");
        el.id = "typing";
        el.className = "typing";
        el.textContent = "digitando…";
        messagesEl.appendChild(el);
      }
    } else if (el) el.remove();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  appendMessage("assistant", "Oi! Sou o atendimento virtual da clínica. Como posso ajudar?");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    appendMessage("user", text);
    setTyping(true);
    try {
      const res = await fetch("/webchat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, message: text }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "erro");
      chatId = data.chatId;
      localStorage.setItem("clinicChatId", chatId);
      setTyping(false);
      appendMessage("assistant", data.reply || "…");
    } catch (err) {
      setTyping(false);
      appendMessage("assistant", "Desculpa, algo deu errado. Pode tentar de novo?");
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
